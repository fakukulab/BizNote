name: BizNote
options:
  bundleIdPrefix: com.biznote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  BizNote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BizNote
    resources:
      - path: BizNote/Resources
      - path: PrivacyInfo.xcprivacy
    info:
      path: BizNote/Info.plist
      properties:
        CFBundleDisplayName: BizNote
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 명함을 스캔하여 연락처 정보를 자동으로 입력합니다.
        NSCalendarsFullAccessUsageDescription: 등록한 행사 일정을 캘린더 앱에 추가하기 위해 사용합니다.
        NSContactsUsageDescription: 명함 정보를 주소록에 추가하거나 중복된 연락처를 확인하기 위해 사용합니다.
        NSRemindersFullAccessUsageDescription: 업무 항목을 미리 알림 앱과 동기화하기 위해 사용합니다.
        NSLocationWhenInUseUsageDescription: 회의록의 위치 항목에 현재 위치를 자동으로 입력하기 위해 사용합니다.
        NSPhotoLibraryUsageDescription: 노트에 사진을 첨부할 수 있습니다.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fakuku.biznote
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8S2Y83DCGM
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SWIFT_EMIT_LOC_STRINGS: YES
